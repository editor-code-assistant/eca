name: Tests

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'resources/ECA_VERSION'
      - 'docs/**'
      - 'images/**'
      - 'mkdocs.yml'
      - 'deps-lock.json'
      - '.github/workflows/nightly.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/release.yml'

  pull_request:

env:
  # Single source of truth for the Clojure tooling, also part of the dependency
  # cache keys so bumping it refreshes ~/.deps.clj (bb's own Clojure tools).
  CLOJURE_CLI_VERSION: '1.12.0.1530'
  BB_VERSION: '1.12.200'

jobs:
  unit-test:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        # 25 is preinstalled on all runner images (no JDK download) and
        # supports the AOT cache used by the JVM integration tests.
        jdk: [25]
        include:
          - os: windows-latest
            jdk: 25
          - os: macos-latest
            jdk: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.jdk }}

      - name: Install Clojure
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: ${{ env.CLOJURE_CLI_VERSION }}
          bb: ${{ env.BB_VERSION }}

      - name: Cache Clojure dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          # Keyed per job: jobs resolve different aliases, and with a shared
          # key only the first job to finish would ever save its subset.
          key: clj-deps-${{ runner.os }}-${{ github.job }}-${{ env.CLOJURE_CLI_VERSION }}-${{ env.BB_VERSION }}-${{ hashFiles('deps.edn', 'bb.edn', 'integration-test/mcp-server-sample/deps.edn', 'integration-test/mcp-server-sample/bb.edn') }}
          restore-keys: |
            clj-deps-${{ runner.os }}-${{ github.job }}-${{ env.CLOJURE_CLI_VERSION }}-${{ env.BB_VERSION }}-
            clj-deps-${{ runner.os }}-${{ github.job }}-

      - name: Run tests
        run: bb test

  jvm-integration-test:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        jdk: [25]
        include:
          - os: windows-latest
            jdk: 25
          - os: macos-latest
            jdk: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.jdk }}

      - name: Install clojure build tools
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: ${{ env.CLOJURE_CLI_VERSION }}
          bb: ${{ env.BB_VERSION }}

      - name: Cache Clojure dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: clj-deps-${{ runner.os }}-${{ github.job }}-${{ env.CLOJURE_CLI_VERSION }}-${{ env.BB_VERSION }}-${{ hashFiles('deps.edn', 'bb.edn', 'integration-test/mcp-server-sample/deps.edn', 'integration-test/mcp-server-sample/bb.edn') }}
          restore-keys: |
            clj-deps-${{ runner.os }}-${{ github.job }}-${{ env.CLOJURE_CLI_VERSION }}-${{ env.BB_VERSION }}-
            clj-deps-${{ runner.os }}-${{ github.job }}-

      - name: Generate embedded binary
        run: |
          # On Windows, babashka.deps/clojure sometimes fails with
          # AccessDeniedException exception when renaming temp files
          # while downloading dependencies. Workaround: offload some
          # of the deps download to the clojure CLI tool.
          #
          # See https://clojure.atlassian.net/browse/TBUILD-47
          clojure -P
          bb prod-cli

      - name: Run integration tests
        run: bb integration-test

  graalvm-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Install Clojure
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: ${{ env.CLOJURE_CLI_VERSION }}
          bb: ${{ env.BB_VERSION }}

      - name: Cache Clojure dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: clj-deps-${{ runner.os }}-${{ github.job }}-${{ env.CLOJURE_CLI_VERSION }}-${{ env.BB_VERSION }}-${{ hashFiles('deps.edn', 'bb.edn', 'integration-test/mcp-server-sample/deps.edn', 'integration-test/mcp-server-sample/bb.edn') }}
          restore-keys: |
            clj-deps-${{ runner.os }}-${{ github.job }}-${{ env.CLOJURE_CLI_VERSION }}-${{ env.BB_VERSION }}-
            clj-deps-${{ runner.os }}-${{ github.job }}-

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          native-image-musl: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build static Linux native image
        env:
          ECA_XMX: "-J-Xmx6g"
          ECA_STATIC: true
          ECA_MUSL: true
        run: |
          bb native-cli

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: eca-native
          path: eca

  graalvm-integration-test:
    needs: graalvm-build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Install clojure build tools
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: ${{ env.CLOJURE_CLI_VERSION }}
          bb: ${{ env.BB_VERSION }}

      - name: Cache Clojure dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: clj-deps-${{ runner.os }}-${{ github.job }}-${{ env.CLOJURE_CLI_VERSION }}-${{ env.BB_VERSION }}-${{ hashFiles('deps.edn', 'bb.edn', 'integration-test/mcp-server-sample/deps.edn', 'integration-test/mcp-server-sample/bb.edn') }}
          restore-keys: |
            clj-deps-${{ runner.os }}-${{ github.job }}-${{ env.CLOJURE_CLI_VERSION }}-${{ env.BB_VERSION }}-
            clj-deps-${{ runner.os }}-${{ github.job }}-

      - name: Install tinyproxy
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq tinyproxy

      - uses: actions/download-artifact@v4
        name: eca-native

      - name: Setup binary
        run: |
          cp -rf eca-native/eca eca
          chmod +x eca

      - name: Run integration tests (via proxy)
        run: bb integration-test --proxy

  nix-build:
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command deps-lock-update
      - run: |
          echo "checking if deps-lock.json is up to date"
          git diff --exit-code
      - run: nix build
