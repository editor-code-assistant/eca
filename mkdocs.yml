site_name: ECA - Editor Code Assistant
site_description: ECA is a free, open-source AI pair programming tool that connects any LLM to any editor via a standardized protocol. Works with VS Code, Emacs, Neovim, IntelliJ, Desktop, CLI and supports OpenAI, Anthropic, Copilot, Ollama and more.
site_url: https://eca.dev

repo_name: editor-code-assistant/eca
repo_url: https://github.com/editor-code-assistant/eca

# Internal notes and visual changelog related to developing the docs site, not published
exclude_docs: |
  evolution/

nav:
  - Home: index.md
  - Documentation:
    - Install: install.md
    - Features: features.md
    - Workflows: workflows.md
    - Configuration:
      - Introduction: config/introduction.md
      - Providers / Models: config/models.md
      - Tools / Approval: config/tools.md
      - Variants: config/variants.md
      - Skills: config/skills.md
      - Rules: config/rules.md
      - Commands: config/commands.md
      - Agents / Subagents: config/agents.md
      - Hooks: config/hooks.md
      - Completion: config/completion.md
      - Rewrite: config/rewrite.md
      - Inline chat: config/chat-inline.md
      - Context Management: config/context-management.md
      - Plugins / Marketplace: config/plugins.md
      - Metrics: config/metrics.md
      - Remote: config/remote.md
      - Network / Enterprise: config/network.md
      - Sandboxing: config/sandboxing.md
      - User Examples: config/examples.md
    - ECA Protocol: protocol.md
    - read-chat CLI: read-chat.md
    - Troubleshooting: troubleshooting.md
  - Install: /install/
  - Configuration: /config/introduction/
  - Protocol: /protocol/
  - Troubleshooting: /troubleshooting/
  - Plugins: https://plugins.eca.dev
  - Support Us: https://github.com/sponsors/editor-code-assistant

theme:
  name: material
  custom_dir: docs/overrides
  logo: images/logo.svg
  favicon: images/logo.svg
  font:
    text: Inter
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - toc.follow
    - content.code.copy
    - content.code.select

copyright: Copyright &copy; 2026 ECA Contributors. Free & Open Source.

extra:
  # Right-hand table of contents shows only the current section's
  # subsections, with arrows to open or close the others.
  # See docs/js/toc-collapse.js
  toc_collapse: false
  # Left sidebar: clicking a collapsed group opens its first page
  # instead of only expanding it. See docs/js/nav-open-first.js
  nav_open_first: false
  analytics:
    provider: google
    property: G-VFJYDKR1MR
  social:
    - icon: fontawesome/brands/github-alt
      link: https://github.com/editor-code-assistant/eca
    - icon: fontawesome/brands/slack
      link: https://clojurians.slack.com/archives/C093426FPUG
    - icon: fontawesome/solid/heart
      link: https://github.com/sponsors/editor-code-assistant

extra_css:
  # Material loads Inter as separate 300/400/700 files. The site also
  # uses 500 (sidebar items) and 600 (headings). Inter's variable file
  # covers 300 to 700 in one face. It is declared after Material's, so
  # every weight renders from it and none is swapped for a nearby weight
  # while files load
  - https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=fallback
  - stylesheets/layout.css

extra_javascript:
  - js/toc-hash.js

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - codehilite
  - meta
  - toc:
      permalink: '#'
      # Material uses this as the right sidebar heading
      title: On This Page
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

plugins:
  - search
  - awesome-pages
  - git-revision-date-localized
